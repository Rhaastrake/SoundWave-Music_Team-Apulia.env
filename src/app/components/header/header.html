<mat-toolbar color="primary" class="app-toolbar">
  <div class="toolbar-container">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <mat-icon class="logo-icon">graphic_eq</mat-icon>
      <span>SoundWave</span>
    </a>

    <nav class="desktop-nav">
      <a
        mat-button
        routerLink="/"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="exactMatch"
        >Home</a
      >
      <a mat-button routerLink="/catalog" routerLinkActive="active-link">Catalogo</a>
      <a mat-button routerLink="/favorites" routerLinkActive="active-link">Preferiti</a>
      <a mat-button routerLink="/playlists" routerLinkActive="active-link">Playlist</a>
      <a mat-button routerLink="/concerts" routerLinkActive="active-link">Concerti</a>
      <a mat-button routerLink="/prenotazioni" routerLinkActive="active-link">Prenotazioni</a>
    </nav>

    <button
      mat-icon-button
      class="hamburger-btn"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      [attr.aria-label]="menuLabel()"
      aria-controls="mobile-drawer"
    >
      <mat-icon>{{ menuIcon() }}</mat-icon>
    </button>
  </div>
</mat-toolbar>

<div class="menu-backdrop" [class.open]="isMenuOpen()" (click)="closeMenu()"></div>

<nav id="mobile-drawer" class="mobile-drawer" [class.open]="isMenuOpen()">
  <mat-nav-list>
    <a
      mat-list-item
      routerLink="/"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="exactMatch"
      (click)="closeMenu()"
    >
      <mat-icon matListItemIcon>home</mat-icon>
      <span matListItemTitle>Home</span>
    </a>

    <a mat-list-item routerLink="/catalog" routerLinkActive="active-link" (click)="closeMenu()">
      <mat-icon matListItemIcon>library_music</mat-icon>
      <span matListItemTitle>Catalogo</span>
    </a>

    <a mat-list-item routerLink="/favorites" routerLinkActive="active-link" (click)="closeMenu()">
      <mat-icon matListItemIcon>favorite</mat-icon>
      <span matListItemTitle>Preferiti</span>
    </a>

    <a mat-list-item routerLink="/playlists" routerLinkActive="active-link" (click)="closeMenu()">
      <mat-icon matListItemIcon>queue_music</mat-icon>
      <span matListItemTitle>Playlist</span>
    </a>

    <a mat-list-item routerLink="/concerts" routerLinkActive="active-link" (click)="closeMenu()">
      <mat-icon matListItemIcon>event</mat-icon>
      <span matListItemTitle>Concerti</span>
    </a>

    <a
      mat-list-item
      routerLink="/prenotazioni"
      routerLinkActive="active-link"
      (click)="closeMenu()"
    >
      <mat-icon matListItemIcon>confirmation</mat-icon></a
    ></mat-nav-list
  >
</nav>
