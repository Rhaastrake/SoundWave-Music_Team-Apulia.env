<mat-card class="album-card" matRipple [routerLink]="'/music/' + album().id">
  <div class="album-image">
    @if (album().imageUrl) {
      <img mat-card-image [src]="album().imageUrl" [alt]="album().title" />
    } @else {
      <div class="placeholder-image">
        <mat-icon>album</mat-icon>
      </div>
    }
  </div>

  <mat-card-content class="album-info">
    <h3 class="album-title">{{ album().title }}</h3>git 
    <p class="album-artist">{{ album().artist.name }}</p>

    <div class="album-meta">
      <span class="badge genre">{{ genreLabel }}</span>
      <span class="badge type">{{ typeLabel }}</span>
      <span class="album-year">{{ year }}</span>
    </div>
  </mat-card-content>
</mat-card>
